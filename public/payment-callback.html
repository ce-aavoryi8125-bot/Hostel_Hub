<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verifying Payment — Hostel Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #1e293b; border-radius: 20px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.08); }
    .logo { font-size: 32px; font-weight: 900; color: white; letter-spacing: -0.02em; margin-bottom: 32px; }
    .logo span { color: #f59e0b; }
    .spinner { width: 56px; height: 56px; border: 4px solid rgba(255,255,255,0.12); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    p  { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.6; }
    .status-icon { font-size: 56px; margin-bottom: 16px; }
    .success { color: #10b981; }
    .failed  { color: #ef4444; }
    .detail-box { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin: 24px 0; text-align: left; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: rgba(255,255,255,0.45); }
    .detail-value { font-weight: 700; }
    .btn { display: inline-block; padding: 13px 28px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; border: none; transition: opacity 0.2s; margin: 6px; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-outline { background: transparent; color: white; border: 1.5px solid rgba(255,255,255,0.2); }
    .btn:hover { opacity: 0.85; }
    .ref-badge { display: inline-block; background: rgba(99,102,241,0.2); color: #a5b4fc; font-size: 13px; font-weight: 700; padding: 6px 16px; border-radius: 20px; letter-spacing: 0.05em; margin: 12px 0; border: 1px solid rgba(99,102,241,0.3); }
    .wa-btn { background: #25d366; }
  </style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">Hostel<span>Hub</span></div>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Verifying your payment…</h1>
  <p id="subtitle">Please wait. Do not close this tab.</p>
  <div id="details" style="display:none"></div>
  <div id="actions" style="display:none; margin-top:20px;"></div>
</div>

<script>
(async () => {
  const params    = new URLSearchParams(window.location.search);
  const reference = params.get('reference') || params.get('trxref');
  const token     = localStorage.getItem('hostelHubToken');

  const $ = id => document.getElementById(id);

  function showSuccess(data) {
    $('spinner').style.display = 'none';
    $('title').innerHTML = '<span class="success">✓</span> Booking Confirmed!';
    $('subtitle').textContent = 'Your payment was successful. Your room is reserved.';

    const p = data.payment || {};
    const b = data.booking  || {};
    $('details').innerHTML = `
      <div class="detail-box">
        <div class="detail-row"><span class="detail-label">Hostel</span><span class="detail-value">${p.hostel_name || '—'}</span></div>
        <div class="detail-row"><span class="detail-label">Room Type</span><span class="detail-value">${p.room_type || '—'}</span></div>
        <div class="detail-row"><span class="detail-label">Amount Paid</span><span class="detail-value success">GHS ${Number(p.amount||0).toLocaleString()}</span></div>
        <div class="detail-row"><span class="detail-label">Payment Method</span><span class="detail-value">${p.channel || 'Card'}</span></div>
        <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value success">✓ Verified</span></div>
      </div>
      <div class="ref-badge">Booking Ref: ${b.reference || p.reference || '—'}</div>
      <p style="font-size:12px;margin-top:8px;">Save this reference. Quote it to your agent to collect your keys.</p>
    `;
    $('details').style.display = 'block';

    const agentPhone = localStorage.getItem('hhAgentPhone') || '';
    const waLink = agentPhone ? `https://wa.me/${agentPhone.replace(/\s+/g,'')}?text=Hello, I have paid for ${p.room_type} at ${p.hostel_name}. Booking ref: ${b.reference || p.reference}` : '#';
    $('actions').innerHTML = `
      <a href="/" class="btn btn-primary">Go to Dashboard</a>
      ${agentPhone ? `<a href="${waLink}" target="_blank" class="btn btn-outline wa-btn">💬 WhatsApp Agent</a>` : ''}
    `;
    $('actions').style.display = 'block';
    localStorage.removeItem('hhAgentPhone');
  }

  function showFailed(message) {
    $('spinner').style.display = 'none';
    $('title').innerHTML = '<span class="failed">✕</span> Payment Not Completed';
    $('subtitle').textContent = message || 'Your payment was not completed. You have not been charged.';
    $('actions').innerHTML = `<a href="/" class="btn btn-primary">Try Again</a>`;
    $('actions').style.display = 'block';
  }

  if (!reference) { showFailed('No payment reference found in URL.'); return; }
  if (!token)     { showFailed('Not logged in. Please sign in and try again.'); return; }

  try {
    const res  = await fetch(`/api/payments/verify/${reference}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await res.json();
    if (res.ok && data.status === 'success') {
      showSuccess(data);
    } else {
      showFailed(data.message || `Payment status: ${data.status || 'unknown'}`);
    }
  } catch (e) {
    showFailed('Network error while verifying payment. Contact support with your reference: ' + reference);
  }
})();
</script>
</body>
</html>
